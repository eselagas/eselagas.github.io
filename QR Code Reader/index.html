<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QR Code Reader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://unpkg.com/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 1rem;
      background: #111;
      color: #eee;
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    button, input[type="file"], select {
      background: #222;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 0.4rem 0.7rem;
      font-size: 0.9rem;
    }
    button:hover {
      background: #333;
      cursor: pointer;
    }
    #video {
      width: 100%;
      max-width: 480px;
      border-radius: 8px;
      background: #000;
    }
    #result {
      margin-top: 0.75rem;
      padding: 0.5rem;
      background: #181818;
      border-radius: 4px;
      font-size: 0.9rem;
      word-break: break-all;
      min-height: 2.5rem;
    }
    #status {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <h1>QR Code Reader</h1>

  <div class="controls">
    <button id="startCameraBtn">Start Camera</button>
    <button id="stopCameraBtn" disabled>Stop Camera</button>

    <select id="cameraSelect"></select>

    <label>
      <span style="font-size:0.85rem;">Scan from file</span>
      <input type="file" id="fileInput" accept="image/*" />
    </label>
  </div>

  <video id="video" muted playsinline></video>

  <div id="status">Idle</div>
  <div id="result">No QR code detected yet.</div>

  <script>
    QrScanner.WORKER_PATH = "https://unpkg.com/qr-scanner@1.4.2/qr-scanner-worker.min.js";

    const video = document.getElementById("video");
    const startBtn = document.getElementById("startCameraBtn");
    const stopBtn = document.getElementById("stopCameraBtn");
    const fileInput = document.getElementById("fileInput");
    const resultEl = document.getElementById("result");
    const statusEl = document.getElementById("status");
    const cameraSelect = document.getElementById("cameraSelect");

    let qrScanner = null;
    let currentCameraId = null;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setResult(text) {
      resultEl.textContent = text || "No QR code detected.";
    }

    async function populateCameras() {
      try {
        const cameras = await QrScanner.listCameras(true);
        cameraSelect.innerHTML = "";
        cameras.forEach((cam, index) => {
          const option = document.createElement("option");
          option.value = cam.id;
          option.textContent = cam.label || `Camera ${index + 1}`;
          cameraSelect.appendChild(option);
        });
        if (cameras.length > 0) {
          currentCameraId = cameras[0].id;
        }
      } catch (err) {
        console.error(err);
        setStatus("Could not list cameras.");
      }
    }

    async function startCamera() {
      if (qrScanner) {
        await qrScanner.stop();
        qrScanner.destroy();
        qrScanner = null;
      }

      setStatus("Starting camera…");

      qrScanner = new QrScanner(
        video,
        (decodedText) => {
          setResult(decodedText);
        },
        {
          preferredCamera: currentCameraId || "environment",
          highlightScanRegion: false,
          highlightCodeOutline: true,
          maxScansPerSecond: 10,
        }
      );

      try {
        await qrScanner.start();
        startBtn.disabled = true;
        stopBtn.disabled = false;
        setStatus("Camera running. Point at a QR code.");
      } catch (err) {
        console.error(err);
        setStatus("Failed to start camera: " + err.message);
      }
    }

    async function stopCamera() {
      if (!qrScanner) return;
      await qrScanner.stop();
      startBtn.disabled = false;
      stopBtn.disabled = true;
      setStatus("Camera stopped.");
    }

    cameraSelect.addEventListener("change", async (e) => {
      currentCameraId = e.target.value;
      if (qrScanner && qrScanner._active) {
        // Switch camera
        setStatus("Switching camera…");
        await qrScanner.setCamera(currentCameraId);
        setStatus("Camera running.");
      }
    });

    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);

    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      setStatus("Scanning image…");
      try {
        const result = await QrScanner.scanImage(file, { returnDetailedScanResult: true });
        setResult(result.data || result);
        setStatus("Image scan complete.");
      } catch (err) {
        console.error(err);
        setResult("No QR code found in image.");
        setStatus("Image scan finished (no code).");
      } finally {
        fileInput.value = "";
      }
    });

    // Initial setup
    (async () => {
      setStatus("Listing cameras…");
      await populateCameras();
      setStatus("Ready. Start camera or choose an image.");
    })();
  </script>
</body>
</html>
